[project]
name = "specfem-process"
version = "0.1.0"
description = "Processing scripts for SPECfem workflows"
requires-python = ">=3.10"
dependencies = [
    "mpi4py>=4.1.1",
    "numpy>=2.2.6",
    "obspy>=1.5.0",
    "pandas>=2.0",
    "tqdm>=4.67.3",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"
