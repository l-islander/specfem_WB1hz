# multi_gpu/kubernetes/indexed_job_one_gpu_per_source.yaml -- ILLUSTRATIVE.
#
# The forward stage as a Kubernetes Indexed Job: 150 completions (one per virtual source),
# up to 72 pods at a time, one GPU per pod. Run:ai and NVIDIA Mission Control schedule Kubernetes
# workloads of this shape (whole-GPU requests, backfill); site-specific fields (project/queue,
# scheduler name, image registry, volume names) are placeholders. The loop needs nothing from
# the scheduler beyond "run this command on one GPU with the shared tree mounted": completion
# markers on the shared filesystem make tasks idempotent, so retries and preemption are safe.
#
# Not yet run: the Huang Complex scheduler and container model will be adopted in project Q1.
# Prerequisite: the model's database at /work/mgpu_db/M6, built once (the build_database.sbatch body, with WORKBASE=/work).
apiVersion: batch/v1
kind: Job
metadata:
  name: wb-forward-m6
spec:
  completionMode: Indexed
  completions: 150          # sources in sources.list
  parallelism: 72           # one NVL72 rack
  backoffLimit: 300         # per-source retries are cheap and idempotent
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: specfem
        image: <registry>/specfem3d-4.1.1-cuda13-aarch64:latest   # SPECFEM + Python stack; image recipe to be written in Q1 (not in this repository)
        resources:
          limits:
            nvidia.com/gpu: 1
        env:
        - name: MODEL
          value: /work/models/M6
        - name: WORKBASE            # per-source work dirs and the shared database live on the PVC
          value: /work
        command: ["/bin/bash", "-lc"]
        args:
        - >-
          cd /work/specfem_WB1hz/multi_gpu &&
          ./worker_one_source.sh /work/sources.list:$((JOB_COMPLETION_INDEX + 1))
          /work/mgpu_db/M6 "$MODEL" /work/result_M6
        volumeMounts:
        - {name: work, mountPath: /work}
      volumes:
      - name: work
        persistentVolumeClaim: {claimName: <shared-scratch-pvc>}
